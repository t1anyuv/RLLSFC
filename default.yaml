# Default configuration for LETI / LearnedTShape.
# Usage examples:
#   python -m scripts.experiments.train_debug --config default.yaml
#   python -m scripts.experiments.run_pipeline --config default.yaml --name demo
#   python -m scripts.preprocess.similarity_matrix --config default.yaml --dataset cdtaxi

experiment:
  name: default
  description: "Default local experiment configuration."

datasets:
  active: tdrive  # Active dataset profile. Example values: tdrive, cdtaxi.
  profiles:
    tdrive:
      description: "Beijing TDrive dataset."
      trajectory_path: "D:/dataset/Trajectory/TDrive/complete_clean/tdrive.txt"  # Cleaned trajectory file.
      query_root: "resource/queries_tdirve"  # Query split root for this dataset.
      min_x: 115.29  # Dataset bbox minimum longitude.
      min_y: 39.00   # Dataset bbox minimum latitude.
      max_x: 117.83  # Dataset bbox maximum longitude.
      max_y: 41.50   # Dataset bbox maximum latitude.
    cdtaxi:
      description: "Chengdu CDTaxi dataset."
      trajectory_path: "D:/dataset/Trajectory/Chengdu/cleaned_cd_taxi.txt"
      query_root: "resource/queries_chengdu"
      min_x: 104.04
      min_y: 30.65
      max_x: 104.13
      max_y: 30.73

index:
  max_level: 8  # Quadtree depth. Example: 8 for training, 9 for finer indexing.
  alpha: 2      # Enlarged element width in cell units. Example: 2 or 3.
  beta: 2       # Enlarged element height in cell units. Example: 2 or 3.
  min_x: 115.29 # Optional index bbox values. Usually keep aligned with the active dataset profile.
  min_y: 39.00
  max_x: 117.83
  max_y: 41.50
  use_original_bbox: true         # true: use dataset bbox; false: normalize to [0, 0, 1, 1].
  use_prune: true                 # Whether to merge sparse cells after trajectory assignment.
  min_cell_trajs: 4               # Example minTrajs threshold used during pruning.
  quadcode_include_muted: false   # Whether baseline quadcode order should include muted cells.
  enable_sig_optimize: true       # Whether to optimize per-cell local alpha/beta before signatures.
  parallel_signatures: true       # Compute signatures in parallel when possible.
  signature_workers: null         # Example: 8. null uses the default executor behavior.

data:
  num_trajectories: -1            # -1 means load all trajectories; example: 3000 for a quick run.
  source: "dataset"               # dataset | synthetic.
  use_similarity_matrix: true     # Whether to load or build a precomputed similarity matrix.
  similarity_matrix_path: null    # Optional explicit path. null uses the dataset-aware default file name.
  similarity_num_workers: 4       # Worker count for similarity matrix computation.
  similarity_use_gpu: true        # Enable GPU acceleration when supported by the implementation.
  similarity_gpu_batch_size: 1024 # Example batch size for GPU similarity computation.
  parallel_trajectory_assign: true
  trajectory_assign_workers: null # Example: 8.
  storage_mode: "auto"            # memory | disk | auto.
  storage_dir: null               # Example: "resource/storage". null uses the default.
  disk_cache_mb: 2048             # Disk mode LRU cache size in MB.

reward:
  tau_loc: 1.0                    # Interval seek / positioning cost weight.
  tau_scan: 0.1                   # Scan length cost weight.
  local_reward_weight: 0.4        # Weight of local reward in training.
  global_reward_weight: 1.0       # Weight of global reward in training.
  reward_schedule_episodes: 100   # Episodes used to warm up reward scaling.
  global_reward_start_scale: 0.25
  local_reward_start_scale: 1.0
  global_reward_scale: 2.0
  global_reward_num_evals: 1      # How many global evaluations to average each trigger.
  global_reward_query_sample_size: 64  # Example: 64. null means use all queries.
  global_reward_frontload_exponent: 1.5
  query_distribution_type: "skewed"       # uniform | gaussian | skewed.
  query_sample_ratio: 1.0                 # Example: 0.25 for a fast debug run.

network:
  hidden_dims: [256, 256]  # Example MLP layout for actor/critic.
  device: auto             # auto | cuda | cpu.
  dropout: 0.1
  state_dim: 14

train:
  lr_actor: 0.0003
  lr_critic: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  num_episodes: 400          # Example: 10 for debug, 400+ for full experiments.
  eval_interval: 10
  save_interval: 10
  eps_clip: 0.2
  k_epochs: 4
  gradient_clip_norm: 1.0
  entropy_coef_start: 0.05
  entropy_coef_end: 0.001
  entropy_decay_episodes: -1 # -1 keeps a fixed entropy coefficient.
  topk_actions: 30           # Example top-k action cap. null disables top-k filtering.
  topk_decay_episodes: 100
  topk_multipliers: [2.0, 1.0]
  enable_early_stopping: true
  early_stopping_patience: 8
  early_stopping_min_delta: 0.01
  max_negative_streak: 5

paths:
  resource_base_dir: "resource"  # All local datasets, queries, matrices, and outputs live here.
